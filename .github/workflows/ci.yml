name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv lock --check
          uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: |
          uv run --locked --extra dev python -m ruff check src tests
          uv run --locked --extra dev python -m ruff format --check src tests

      - name: Run tests with coverage
        env:
          PYTHONIOENCODING: utf-8
        run: |
          uv run --locked --extra dev python -m pytest --cov=src/maidanlao --cov-report=term-missing --cov-fail-under=80

      - name: CLI smoke
        env:
          PYTHONIOENCODING: utf-8
        run: uv run --locked python -m maidanlao.cli smoke
