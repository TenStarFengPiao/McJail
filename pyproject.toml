[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maidanlao"
version = "0.1.0"
description = "McJail: an AI-powered campus assistant for QQ with knowledge retrieval, file delivery, and admin notifications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langchain>=1.4,<2", "langchain-core>=1.0", "langchain-openai>=1.0", "pydantic>=2.0", "websockets>=14.0", "SQLAlchemy>=2.0.22,<3"]

[project.urls]
Homepage = "https://github.com/TenStarFengPiao/McJail"
Repository = "https://github.com/TenStarFengPiao/McJail"
Issues = "https://github.com/TenStarFengPiao/McJail/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["src/maidanlao"]
omit = [
    "src/maidanlao/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
